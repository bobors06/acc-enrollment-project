{% extends 'base.html' %}{% block content %}<div class="form-card"><p class="eyebrow">NEW STUDENT</p><h1>Create your account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="two-col"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label></div><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Username<input name="username" required autocomplete="username"></label><label>Password <small>(minimum 8 characters)</small><input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="button">Create account</button></form></div>{% endblock %}
