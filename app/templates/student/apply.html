{% extends 'base.html' %}{% block content %}<div class="form-card"><p class="eyebrow">ENROLLMENT APPLICATION</p><h1>Apply for enrollment</h1><p class="muted">Your application will be reviewed by the admissions team.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Program<select name="program" required><option value="">Select a program</option>{% for program in programs %}<option>{{ program }}</option>{% endfor %}</select></label><label>School year<input name="school_year" placeholder="2026–2027" required></label><label>Notes <small>(optional)</small><textarea name="notes" rows="4" maxlength="500" placeholder="Anything the admissions team should know?"></textarea></label><button class="button">Submit application</button></form></div>{% endblock %}
